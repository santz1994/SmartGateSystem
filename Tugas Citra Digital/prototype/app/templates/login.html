<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login — Smart Gate</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="dot"></span>
      <strong>Smart Gate</strong>
      <span class="muted">Prototipe Pengolahan Citra Digital</span>
    </div>
  </header>
  <main>
    <section class="card" style="max-width: 420px; margin: 3rem auto;">
      <h2>Login Operator</h2>
      {% if error %}<p class="muted" style="color:#ff6b6b;">{{ error }}</p>{% endif %}
      <form method="post" action="{{ url_for('login_submit', next=request.args.get('next', '')) }}">
        <label>Username
          <input name="username" autocomplete="username" required>
        </label>
        <label>Password
          <input name="password" type="password" autocomplete="current-password" required>
        </label>
        <button class="btn" type="submit">Masuk</button>
      </form>
    </section>
  </main>
</body>
</html>
