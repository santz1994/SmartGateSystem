<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login — Smart Gate</title>
  <meta name="csrf" content="{{ csrf_token }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css', v=app_version) }}">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="dot"></span>
      <strong>Smart Gate</strong>
      <span class="muted">Sistem Log Kendaraan Terpadu</span>
    </div>
  </header>
  <main>
    <section class="card login-card">
      <h2>Login Operator</h2>
      {% if error %}<p class="bad">{{ error }}</p>{% endif %}
      <form method="post" action="{{ url_for('login_submit', next=request.args.get('next', '')) }}">
        <input type="hidden" name="csrf" value="{{ csrf_token }}">
        <label>Username
          <input name="username" autocomplete="username" required>
        </label>
        <label>Password
          <input name="password" type="password" autocomplete="current-password" required>
        </label>
        <button class="block" type="submit">Masuk</button>
      </form>
    </section>
  </main>
</body>
</html>
